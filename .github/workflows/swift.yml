name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-tests:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build with resolved dependencies
        run: swift build --force-resolved-versions
      - name: Run public sample tests
        shell: bash
        run: |
          set -o pipefail
          swift test --force-resolved-versions --skip '_solution' | tee "$RUNNER_TEMP/swift-samples.log"
          grep -E 'Test run with 23 tests in 12 suites passed' "$RUNNER_TEMP/swift-samples.log"
      - name: Check lockfile
        run: git diff --exit-code -- Package.resolved
